minimumReleaseAgeExcludePrune: true
# pnpm 12 rejects releases newer than minimumReleaseAge (1 day by default).
# These were published right before the dependency upgrade and are pruned automatically once old enough.
minimumReleaseAgeExclude:
  - "@eoussama/dx@0.1.2"

trustPolicy: no-downgrade
shellEmulator: true

# GHSA-238p-pmpm-9mq7: micromark-extension-math (via @eoussama/dx's ESLint markdown support)
# still pins katex@^0.16.0, which has no patched release.
overrides:
  katex@>=0.11.0 <0.18.2: ^0.18.2
