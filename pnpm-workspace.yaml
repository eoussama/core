minimumReleaseAgeExcludePrune: true
# pnpm 12 rejects releases newer than minimumReleaseAge (1 day by default).
# These were published right before the dependency upgrade and are pruned automatically once old enough.
minimumReleaseAgeExclude:
  - "@eoussama/dx@0.1.2"

trustPolicy: no-downgrade
shellEmulator: true

# Transitive dev dependencies pinned to vulnerable ranges with no patched release:
# - katex (GHSA-238p-pmpm-9mq7): pinned to ^0.16.0 by micromark-extension-math, via @eoussama/dx.
# - qs (GHSA-q8mj-m7cp-5q26, GHSA-x5fp-wj9c-mxmx, GHSA-4mjr-xmp4-gh2g): pinned to 6.15.1 by typed-rest-client, via @stryker-mutator/core.
overrides:
  katex@>=0.11.0 <0.18.2: ^0.18.2
  qs@>=2.2.5 <6.16.0: ^6.16.0
